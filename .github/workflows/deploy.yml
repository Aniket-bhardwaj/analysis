name: Deploy to VM

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ACTIONS_SECRET_KEY }}" > ~/.ssh/github-actions
          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/github-actions
          ssh-keyscan -H 172.27.26.225 >> ~/.ssh/known_hosts || echo "Keyscan failed, proceeding without adding host key."

      - name: Test Host Connectivity
        run: |
          ping -c 3 172.27.26.225 || echo "Unable to reach host, please check connectivity."
          
      - name: Deploy to VM
        run: |
          ssh -i ~/.ssh/github-actions -o StrictHostKeyChecking=no ubuntu@172.27.26.225 << 'EOF'
            cd /home/ubuntu/carbon-data-analysis

            echo "Pulling latest code..."
            git pull

            echo "Installing backend dependencies..."
            cd backend
            npm install
            pm2 start app.js --name backend || pm2 restart backend

            echo "Installing frontend dependencies..."
            cd ../frontend
            npm install
            pm2 start "npm start" --name frontend || pm2 restart frontend
          EOF
